name: Exercise art audit

on:
  pull_request:
    paths:
      - 'Apps/Repera/Resources/ExerciseArt/**'
      - 'Apps/Repera/Sources/ExerciseArt.swift'
      - 'Packages/ReperaDomain/Sources/ReperaDomain/CatalogSpanish.swift'
      - 'Packages/ReperaDomain/Tests/ReperaDomainTests/ExerciseArtCaptionTests.swift'
      - 'scripts/audit_exercise_art.py'
      - '.github/workflows/exercise-art-audit.yml'
  push:
    branches:
      - fix/exercise-art-audit-20261017
  workflow_dispatch:

jobs:
  assets:
    name: JPEG and caption structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Audit every exported JPG and thumb
        run: python scripts/audit_exercise_art.py
      - name: Fail on malformed or missing assets
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path('docs/EXERCISE_ART_AUDIT.csv')
          rows=list(csv.DictReader(p.open(encoding='utf-8')))
          structural=('Falta miniatura','Miniatura sin full','Imagen corrupta','Dimensiones','Formato distinto','Stem sin','Hero no','Paso sin','Carrusel:','Paso aislado')
          bad=[(r['stem'],r['problem']) for r in rows if any(x in r['problem'] for x in structural)]
          print(f'{len(rows)} stems audited, {len(bad)} structural defects')
          for stem,reason in bad: print(f'::error title=Invalid ExerciseArt asset::{stem}: {reason}')
          assert not bad, f'{len(bad)} structural defects in ExerciseArt'
          PY
      - name: Archive per-stem report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exercise-art-report
          path: docs/EXERCISE_ART_AUDIT.csv

  domain:
    name: ReperaDomain caption tests
    # swift-tools-version: 6.4 requires the Xcode 27 runner.
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Swift toolchain
        run: |
          sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer
          swift --version
      - name: Run domain unit tests
        run: swift test --package-path Packages/ReperaDomain

  visual-release-gate:
    name: Visual art must be corrected
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Require visual QA for changed art in PR, all art before release
        env:
          AUDIT_EVENT: ${{ github.event_name }}
          AUDIT_BASE: ${{ github.base_ref }}
        run: |
          python scripts/audit_exercise_art.py
          python - <<'PY'
          import csv
          import os
          from pathlib import Path
          import subprocess
          import sys

          rows = list(csv.DictReader(Path('docs/EXERCISE_ART_AUDIT.csv').open(encoding='utf-8')))
          by_stem = {row['stem']: row for row in rows}
          pending = [row for row in rows if row['verdict'] != 'OK']
          print(f"Full visual backlog: {len(pending)} unapproved stems (not automatically OK)")

          if os.environ['AUDIT_EVENT'] == 'pull_request':
              # A maintenance PR cannot visually approve 533 pre-existing JPGs.
              # Every added/edited/deleted JPG in this PR still requires approval.
              base = os.environ['AUDIT_BASE']
              changed = subprocess.run(
                  ['git', 'diff', '--name-only', f'origin/{base}...HEAD', '--',
                   'Apps/Repera/Resources/ExerciseArt/'],
                  capture_output=True, text=True, check=True,
              ).stdout.splitlines()
              stems = {
                  Path(path).stem for path in changed
                  if path.lower().endswith(('.jpg', '.jpeg'))
              }
              if not stems:
                  print("No JPG art changed: visual backlog remains open, but this PR adds no art risk")
                  sys.exit(0)
              missing = [stem for stem in stems if stem not in by_stem]
              unapproved = [
                  row for stem in sorted(stems)
                  if (row := by_stem.get(stem)) is not None and row['verdict'] != 'OK'
              ]
              for stem in missing:
                  print(f'::error title=Missing art review::{stem} not present in audit')
              for row in unapproved:
                  print(f"::error title=Visual QA required::{row['stem']}: {row['verdict']}")
              if missing or unapproved:
                  sys.exit(1)
              print(f'{len(stems)} changed JPG stems approved')
          else:
              # workflow_dispatch / art-release branch: strict full-inventory gate.
              for row in pending[:30]:
                  print(f"::error title=Unapproved art::{row['stem']}: {row['verdict']}")
              if pending:
                  print(f'::error title=Visual QA required::{len(pending)} assets are not approved')
                  sys.exit(1)
          PY
