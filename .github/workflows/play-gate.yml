name: Play gate
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'scripts/play_preflight.sh'
      - 'scripts/promote_to_beta.sh'
      - '.github/workflows/play-gate.yml'
      - '.github/workflows/android-native-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'scripts/play_preflight.sh'
      - 'scripts/promote_to_beta.sh'
      - '.github/workflows/play-gate.yml'
      - '.github/workflows/android-native-ci.yml'

# Solo el árbol más nuevo; no gastar runners en pushes superados.
concurrency:
  group: play-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  play-gate:
    name: JVM + androidTest compile (preflight)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
      - name: Ensure Android SDK tools 22.0
        run: |
          TOOLS_DIR="$ANDROID_HOME/cmdline-tools"
          test -x "$TOOLS_DIR/22.0/bin/sdkmanager"
          test -x "$TOOLS_DIR/22.0/bin/avdmanager"
          if [ "$(readlink -f "$TOOLS_DIR/latest")" != "$(readlink -f "$TOOLS_DIR/22.0")" ]; then
            if [ -L "$TOOLS_DIR/latest" ]; then
              rm "$TOOLS_DIR/latest"
            elif [ -e "$TOOLS_DIR/latest" ]; then
              mv "$TOOLS_DIR/latest" "$TOOLS_DIR/preinstalled-backup"
            fi
            ln -s "$TOOLS_DIR/22.0" "$TOOLS_DIR/latest"
          fi
          echo "$TOOLS_DIR/22.0/bin" >> "$GITHUB_PATH"
          test "$(readlink -f "$TOOLS_DIR/latest")" = "$(readlink -f "$TOOLS_DIR/22.0")"
      - name: Install API 37
        run: |
          ANDROID_CLI=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name android -perm -u+x | sort -V | tail -n 1)
          if [ -z "$ANDROID_CLI" ]; then
            echo "::error::Android CLI no encontrado en el SDK instalado"
            exit 1
          fi
          "$ANDROID_CLI" sdk install --canary 'platforms/android-37.0' 'build-tools/36.0.0'
      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '9.6.0'
      - name: Play preflight (fuente única)
        env:
          PLAY_PREFLIGHT_USE_SYSTEM_GRADLE: '1'
        run: bash scripts/play_preflight.sh
      - name: Upload JVM test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: play-gate-test-results
          path: |
            android/domain/build/test-results/**
            android/mobile/build/test-results/**
            android/domain/build/reports/tests/**
            android/mobile/build/reports/tests/**
          if-no-files-found: ignore
