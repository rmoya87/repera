name: Diagnose recorded native launch

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-captured-native-launch.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  inspect-recorded-launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download prior actual iOS simulator screen recording
        uses: actions/download-artifact@v4
        with:
          name: repera-native-launch-visual-proof
          run-id: 40136930983
          repository: rmoya87/repera
          github-token: ${{ github.token }}
          path: prior-launch-artifact
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install opencv-python-headless pillow numpy
      - name: Analyze every early simulator frame visually
        run: |
          python - <<'PY'
          from pathlib import Path
          import cv2,numpy as np
          from PIL import Image,ImageDraw,ImageOps
          videos=list(Path('prior-launch-artifact').rglob('*.mp4'))
          print("Videos from actual simulator:",videos)
          assert videos, "No actual iOS simulator recording in artifact"
          cap=cv2.VideoCapture(str(videos[0]))
          count=int(cap.get(cv2.CAP_PROP_FRAME_COUNT))
          fps=cap.get(cv2.CAP_PROP_FPS) or 30
          print('Video frame count / fps:',count,fps)
          # Simulator's H.264 screen recorder is variable-frame-rate and can
          # legitimately produce only 2 frames when the UI does not change.
          assert count>=1, "Recording has no decodable frames"
          out=Image.new('RGB',(4*220,4*490),'white')
          draw=ImageDraw.Draw(out)
          metrics=[]
          for i in range(min(count,16)):
              cap.set(cv2.CAP_PROP_POS_FRAMES,i)
              ok,frame=cap.read()
              if not ok: continue
              rgb=cv2.cvtColor(frame,cv2.COLOR_BGR2RGB)
              small=cv2.resize(rgb,(120,280))
              green=float(np.mean((small[:,:,1]>145)&(small[:,:,0]<115)&(small[:,:,2]<145)))
              cream=float(np.mean((small[:,:,0]>160)&(small[:,:,1]>125)&(small[:,:,2]>95)&(small[:,:,0]>small[:,:,1]*1.08)))
              black=float(np.mean((small[:,:,0]<80)&(small[:,:,1]<80)&(small[:,:,2]<80)))
              metrics.append((i,round(green,3),round(cream,3),round(black,3)))
              image=ImageOps.contain(Image.fromarray(rgb),(220,465))
              x,y=(i%4)*220,(i//4)*490
              out.paste(image,(x+(220-image.width)//2,y+25))
              draw.text((x+5,y+5),f'Frame {i}',fill='black')
          path=Path("docs/assets/repera-native-launch-diagnosis.png")
          path.parent.mkdir(parents=True,exist_ok=True)
          out.save(path)
          print('Frame metric [index, green, cream, black]:',metrics)
          assert metrics,"Video analysis failed"
          PY
      - name: Publish screenshot sheet for inspection
        run: |
          git add docs/assets/repera-native-launch-diagnosis.png
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Capture native startup proof from existing simulator video [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repera-launch-prior-diagnosis
          path: docs/assets/repera-native-launch-diagnosis.png
