name: Rebuild native launch with fully opaque mascot

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/rebuild-opaque-native-launch-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Generate solid green 100% opaque launch image and versioned launch storyboard
        run: |
          python - <<'PY'
          import json
          import plistlib
          from pathlib import Path
          from xml.etree import ElementTree
          from PIL import Image

          assets = Path("Apps/Repera/Resources/Assets.xcassets")
          original = assets / "MascotHero.imageset/mascot-hero.png"
          new_assets = assets / "ReperaLaunchHeroOpaque.imageset"
          new_assets.mkdir(exist_ok=True)
          picture = new_assets / "repera-launch-hero-opaque.png"
          color=(48,209,88)
          hero=Image.open(original).convert("RGBA")
          # Deliberately flatten the ACTUAL corrected Repera mascot. Alpha
          # anywhere in the face can no longer reveal the green screen.
          surface=Image.new("RGBA", hero.size, color+(255,))
          surface.alpha_composite(hero)
          surface.convert("RGB").save(picture, optimize=True)
          (new_assets / "Contents.json").write_text(json.dumps({
              "images":[{"filename":picture.name,"idiom":"universal"}],
              "info":{"author":"xcode","version":1}
          },indent=2)+"\n",encoding="utf-8")

          old_launch = Path("Apps/Repera/Resources/LaunchScreen.storyboard")
          new_launch = old_launch.with_name("ReperaLaunchOpaque.storyboard")
          storyboard = old_launch.read_text()
          assert 'image="MascotHero"' in storyboard
          storyboard = storyboard.replace('image="MascotHero"','image="ReperaLaunchHeroOpaque"')
          storyboard = storyboard.replace('name="MascotHero"','name="ReperaLaunchHeroOpaque"')
          storyboard = storyboard.replace(
              'Mascota transparente independiente del fondo. AspectFit evita recortes o deformaciones.',
              'Mascota y verde opacos; misma proporcion en todas las orientaciones.'
          )
          ElementTree.fromstring(storyboard)
          new_launch.write_text(storyboard)
          old_launch.unlink()

          project=Path("project.yml")
          project_text=project.read_text()
          old_path="Apps/Repera/Resources/LaunchScreen.storyboard"
          new_path="Apps/Repera/Resources/ReperaLaunchOpaque.storyboard"
          assert project_text.count(old_path)==1
          assert "UILaunchStoryboardName: LaunchScreen" in project_text
          project_text=project_text.replace(old_path,new_path)
          project_text=project_text.replace("UILaunchStoryboardName: LaunchScreen",
                                            "UILaunchStoryboardName: ReperaLaunchOpaque")
          project.write_text(project_text)

          plist=Path("Apps/Repera/Resources/Info.plist")
          plist_text=plist.read_text()
          assert "<string>LaunchScreen</string>" in plist_text
          plist_text=plist_text.replace("<string>LaunchScreen</string>",
                                        "<string>ReperaLaunchOpaque</string>")
          plist.write_text(plist_text)
          assert plistlib.loads(plist.read_bytes())["UILaunchStoryboardName"]=="ReperaLaunchOpaque"

          test=Path(".github/workflows/validate-splash-alpha.yml")
          checks=test.read_text()
          checks=checks.replace('      - "Apps/Repera/Resources/Assets.xcassets/MascotHero.imageset/**"',
              '      - "Apps/Repera/Resources/Assets.xcassets/ReperaLaunchHeroOpaque.imageset/**"\n'
              '      - "Apps/Repera/Resources/Assets.xcassets/MascotHero.imageset/**"')
          checks=checks.replace('Path("Apps/Repera/Resources/LaunchScreen.storyboard")',
                                'Path("Apps/Repera/Resources/ReperaLaunchOpaque.storyboard")')
          checks=checks.replace("assert 'image=\"MascotHero\"' in launch",
                                "assert 'image=\"ReperaLaunchHeroOpaque\"' in launch")
          # Regressions: assert there is literally no alpha channel in this image.
          checks=checks.replace(
            '          launch=Path("Apps/Repera/Resources/ReperaLaunchOpaque.storyboard").read_text()',
            '          opaque = np.asarray(Image.open(root/"ReperaLaunchHeroOpaque.imageset/repera-launch-hero-opaque.png").convert("RGB"))\n'
            '          assert tuple(opaque[0,0]) == (48,209,88), "Opaque launch background differs from Repera brand green"\n'
            '          for px,py in ((445,379),(607,411),(518,435)):\n'
            '              assert int(max(opaque[py,px])) < 115, f"Facial feature is green or erased: {(px,py)}"\n'
            '          launch=Path("Apps/Repera/Resources/ReperaLaunchOpaque.storyboard").read_text()'
          )
          test.write_text(checks)
          print("Generated an RGB PNG without alpha and a new native launch storyboard.")
          PY
      - name: Validate PNG opacity, face colors and iOS launch target
        run: |
          python - <<'PY'
          import json, plistlib
          from pathlib import Path
          from xml.etree import ElementTree
          from PIL import Image
          base=Path("Apps/Repera/Resources")
          asset=base/"Assets.xcassets/ReperaLaunchHeroOpaque.imageset"
          config=json.loads((asset/"Contents.json").read_text())
          assert config["images"][0]["filename"]=="repera-launch-hero-opaque.png"
          img=Image.open(asset/"repera-launch-hero-opaque.png")
          assert img.mode=="RGB", f"Expected no alpha whatsoever: {img.mode}"
          assert img.getpixel((0,0))==(48,209,88)
          for pt in ((445,379),(607,411),(518,435)):
              assert max(img.getpixel(pt))<115, f"Pupils/smile not solid dark: {pt}"
          storyboard=ElementTree.parse(base/"ReperaLaunchOpaque.storyboard")
          assert len(storyboard.findall('.//imageView[@image="ReperaLaunchHeroOpaque"]'))==1
          assert len(storyboard.findall('.//resources/image[@name="ReperaLaunchHeroOpaque"]'))==1
          assert not (base/"LaunchScreen.storyboard").exists()
          assert plistlib.loads((base/"Info.plist").read_bytes())["UILaunchStoryboardName"]=="ReperaLaunchOpaque"
          project=Path("project.yml").read_text()
          assert "path: Apps/Repera/Resources/ReperaLaunchOpaque.storyboard" in project
          assert "UILaunchStoryboardName: ReperaLaunchOpaque" in project
          print("PASSED: pixels for both eyes/smile opaque, storyboard and Info.plist use new names.")
          PY
      - name: Commit opaque image and new launch storyboard and remove temporary workflow
        run: |
          git add Apps/Repera/Resources/Assets.xcassets/ReperaLaunchHeroOpaque.imageset \
                  Apps/Repera/Resources/ReperaLaunchOpaque.storyboard \
                  Apps/Repera/Resources/LaunchScreen.storyboard \
                  Apps/Repera/Resources/Info.plist project.yml \
                  .github/workflows/validate-splash-alpha.yml
          git rm .github/workflows/rebuild-opaque-native-launch-once.yml
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Fix cached transparent iOS launch: opaque Repera mascot and new launch storyboard"
          git pull --rebase origin main
          git push origin HEAD:main
