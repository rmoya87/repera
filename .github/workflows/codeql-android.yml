name: CodeQL - Android and Wear OS

on:
  push:
    branches: [main, beta]
    paths:
      - 'android/**'
      - '.github/workflows/codeql-android.yml'
  pull_request:
    branches: [main, beta]
    paths:
      - 'android/**'
      - '.github/workflows/codeql-android.yml'
  schedule:
    - cron: '43 5 * * 3'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kotlin:
    name: CodeQL / java-kotlin (compiled Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android 17 compile SDK
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_CLI=$(find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name android -perm -u+x | sort -V | tail -n 1)
          if [ -z "$ANDROID_CLI" ]; then
            echo "::error::Android CLI not found"
            exit 1
          fi
          "$ANDROID_CLI" sdk install --canary 'platforms/android-37.0' 'build-tools/36.0.0'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Initialize CodeQL for Kotlin
        uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      # CodeQL must observe Kotlin compilation: build-mode none ignores Kotlin.
      # Compile all three native modules; do not publish, sign or run emulators.
      - name: Compile Kotlin with CodeQL tracing
        run: gradle -p android :domain:compileDebugKotlin :mobile:compileDebugKotlin :wear:compileDebugKotlin --no-daemon --stacktrace
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:java-kotlin'
