name: Android and Wear OS native
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-native-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-native-ci.yml'

# Validate the newest tree instead of spending runner capacity on superseded pushes.
concurrency:
  group: android-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-native:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
      - name: Install API 37
        run: sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Domain parity tests + native builds
        run: gradle -p android :domain:testDebugUnitTest :mobile:assembleDebug :wear:assembleDebug --no-daemon --stacktrace
      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-domain-test-results
          path: |
            android/domain/build/test-results/**
            android/domain/build/reports/tests/**
          if-no-files-found: ignore

  android-instrumented:
    name: Phone integration tests on emulator (API ${{ matrix.api }})
    needs: android-native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Cobertura de ejecución real: minSdk 30 y las dos imágenes de
        # sistema más recientes publicadas. NO existe imagen android-37
        # (Android 17) en el repositorio de SDK a 24/10/2026
        # (sdkmanager --channel=3 --list): la ejecución sobre API 37
        # queda bloqueada por Google hasta que se publique la imagen.
        api: ['30', '35', '36.1']
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Android 17 compile SDK
        run: sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real SQLite/JSON workout persistence tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          # UNA sola línea: android-emulator-runner ejecuta cada línea del
          # script en un sh -c distinto, así que un TEST_EXIT en su propia
          # línea se pierde y el paso sale verde aunque fallen los tests.
          script: gradle -p android :mobile:connectedDebugAndroidTest :wear:connectedDebugAndroidTest --no-daemon --stacktrace; TEST_EXIT=$?; mkdir -p android/screenshots; adb pull /sdcard/Pictures/ReperaVerification android/screenshots/ || true; ls -laR android/screenshots/ || true; exit $TEST_EXIT
      - name: Explain failing emulator tests
        if: failure()
        run: |
          echo "## Instrumented test failures" >> "$GITHUB_STEP_SUMMARY"
          find android/mobile/build/outputs/androidTest-results android/wear/build/outputs/androidTest-results -type f -name '*.xml' -print -exec grep -nE 'failure|error|testcase' {} \; || true
          find android/mobile/build/outputs/androidTest-results android/wear/build/outputs/androidTest-results -type f -name '*.xml' -exec sh -c 'for f; do grep -n -A 15 -B 2 "<failure" "$f" || true; done' sh {} + >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Upload visual verification screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-visual-screenshots-api${{ matrix.api }}
          path: android/screenshots/**
          if-no-files-found: ignore
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-results-api${{ matrix.api }}
          path: |
            android/mobile/build/outputs/androidTest-results/**
            android/mobile/build/reports/androidTests/**
            android/wear/build/outputs/androidTest-results/**
            android/wear/build/reports/androidTests/**
          if-no-files-found: ignore
