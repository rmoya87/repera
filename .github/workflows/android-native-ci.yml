name: Android and Wear OS native
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-native-ci.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-native-ci.yml'

# Validate the newest tree instead of spending runner capacity on superseded pushes.
concurrency:
  group: android-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-native:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v4
      - name: Install API 37
        run: sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Domain parity tests + native builds
        run: gradle -p android :domain:testDebugUnitTest :mobile:assembleDebug :wear:assembleDebug --no-daemon --stacktrace
      - name: Upload JVM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-domain-test-results
          path: |
            android/domain/build/test-results/**
            android/domain/build/reports/tests/**
          if-no-files-found: ignore

  android-instrumented:
    name: Phone integration tests on emulator
    needs: android-native
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Android 17 compile SDK
        run: sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real SQLite/JSON workout persistence tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle -p android :mobile:connectedDebugAndroidTest --no-daemon --stacktrace
      - name: Explain failing emulator tests
        if: failure()
        run: |
          echo "## Instrumented test failures" >> "$GITHUB_STEP_SUMMARY"
          find android/mobile/build/outputs/androidTest-results -type f -name '*.xml' -print -exec grep -nE 'failure|error|testcase' {} \; || true
          find android/mobile/build/outputs/androidTest-results -type f -name '*.xml' -exec sh -c 'for f; do grep -n -A 15 -B 2 "<failure" "$f" || true; done' sh {} + >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-results
          path: |
            android/mobile/build/outputs/androidTest-results/**
            android/mobile/build/reports/androidTests/**
          if-no-files-found: ignore
