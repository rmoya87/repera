name: CodeQL - Web and workflows

on:
  push:
    branches: [main, beta]
    paths:
      - 'web/**'
      - 'supabase/functions/**'
      - '.github/workflows/**'
      - 'scripts/**'
  pull_request:
    branches: [main, beta]
    paths:
      - 'web/**'
      - 'supabase/functions/**'
      - '.github/workflows/**'
      - 'scripts/**'
  schedule:
    - cron: '17 5 * * 3'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: CodeQL / ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
