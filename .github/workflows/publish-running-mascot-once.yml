name: Publish authentic Repera running splash asset

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-running-mascot-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Fetch corrected running pose created from original Repera mascot
        run: |
          curl --fail --location --silent --show-error --retry 3 "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:8086ea4d-c3fc-4b47-9ffb-81439890ea7b" --output Apps/Repera/Resources/Assets.xcassets/MascotRunning.imageset/mascot-running.png
      - name: Verify the real PNG and its alpha
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          base = Path('Apps/Repera/Resources/Assets.xcassets')
          runner = base / 'MascotRunning.imageset'
          path = runner / 'mascot-running.png'
          im = Image.open(path).convert('RGBA')
          assert im.width >= 600 and im.height >= 800, 'Unexpected running mascot resolution'
          assert im.getpixel((0,0))[3] == 0 and im.getpixel((im.width-1,im.height-1))[3] == 0, 'Running background not transparent'
          assert im.getpixel((im.width//2,im.height//2))[3] > 240, 'Running figure is not opaque'
          data = json.loads((runner/'Contents.json').read_text(encoding='utf-8'))
          assert data['images'][0]['filename'] == path.name
          hero = Image.open(base/'MascotHero.imageset/mascot-hero.png').convert('RGBA')
          assert hero.getpixel((0,0))[3] == 0
          for p in ((444,381),(606,412),(515,440)):
              assert hero.getpixel(p)[3] == 255, 'Original barbell face must be opaque'
          print('Both splash assets validated', im.size, hero.size)
          PY
      - name: Commit permanent asset and remove temporary tools
        run: |
          git add Apps/Repera/Resources/Assets.xcassets/MascotRunning.imageset/mascot-running.png
          git rm .github/workflows/publish-running-mascot-once.yml
          git rm scripts/build_repera_splash_assets.py
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Use the original Repera character running with transparent exterior and opaque face"
          git push origin HEAD:main
