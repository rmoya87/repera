name: Repair native Repera launch transparency

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-native-launch-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image validation tools
        run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Repair alpha from source artwork and render green background preview
        run: python scripts/fix_launch_barbell_alpha.py
      - name: Point only Apple's native launch storyboard to corrected dedicated asset
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          path=Path('Apps/Repera/Resources/LaunchScreen.storyboard')
          text=path.read_text()
          assert 'image="MascotHero"' in text, "Launch storyboard not using original hero"
          updated=text.replace('image="MascotHero"', 'image="MascotLaunchBarbell"')
          ElementTree.fromstring(updated)
          path.write_text(updated)
          PY
      - name: Validate both resource manifests and original iOS launch references
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root=Path("Apps/Repera/Resources/Assets.xcassets")
          asset=root/"MascotLaunchBarbell.imageset"
          j=json.loads((asset/"Contents.json").read_text())
          assert j["images"][0]["filename"]=="mascot-launch-barbell.png"
          im=Image.open(asset/"mascot-launch-barbell.png").convert("RGBA")
          assert im.getpixel((0,0))[3]==0
          assert im.getpixel((im.width-1,im.height-1))[3]==0
          assert 'image="MascotLaunchBarbell"' in Path("Apps/Repera/Resources/LaunchScreen.storyboard").read_text()
          assert 'UIImage(named: "MascotRunning")' in Path("Apps/Repera/Sources/ReperaApp.swift").read_text()
          print("Native launch: corrected weightlifting figure, transparent exterior")
          print("Second splash: unchanged Repera running mascot")
          PY
      - name: Publish verified launch asset
        run: |
          git add Apps/Repera/Resources/Assets.xcassets/MascotLaunchBarbell.imageset Apps/Repera/Resources/LaunchScreen.storyboard docs/assets/repera-launch-alpha-preview.png
          git rm .github/workflows/fix-native-launch-once.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Repair native splash image alpha and prevent stale MascotHero launch references"
          git push origin HEAD:main
