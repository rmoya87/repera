name: Android gesture debug (focused)
# Workflow de depuracion enfocada: ejecuta SOLO el test de gestos del
# mapa (flujoBusquedaLugarConProveedorSimulado) en UNA pata (API 30) para
# iterar el localizador/inyeccion sin quemar la suite completa de 20 min.
# Lanzar manualmente: gh workflow run android-gesture-debug.yml
#   --ref feat/android-wear-native-parity
# No sustituye a la regresion global de android-native-ci.yml.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-gesture-debug-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gesture:
    name: Gesture test only (API 30)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v4
      - name: Android 17 compile SDK
        run: sdkmanager --channel=3 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Free runner disk for emulator images
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: Run only the place-search gesture test (API 30)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disk-size: 8G
          disable-animations: true
          emulator-options: '-no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -memory 4096'
          # UNA linea (la accion ejecuta cada linea en un sh -c distinto).
          script: adb shell input keyevent 224 || true; adb shell wm dismiss-keyguard || true; adb shell input keyevent 82 || true; sleep 3; adb shell wm dismiss-keyguard || true; gradle -p android :mobile:installDebug --no-daemon --stacktrace; for i in $(seq 1 60); do if adb shell run-as com.app.repera true 2>/dev/null; then echo "usuario-desbloqueado-$i"; break; fi; adb shell input keyevent 224 || true; adb shell wm dismiss-keyguard || true; sleep 10; done; gradle -p android :mobile:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class='dev.repera.mobile.VisualVerificationInstrumentedTest#flujoBusquedaLugarConProveedorSimulado' --no-daemon --stacktrace; TEST_EXIT=$?; echo "TEST_EXIT=$TEST_EXIT"; X=$(ls android/mobile/build/outputs/androidTest-results/connected/debug/TEST-*.xml 2>/dev/null | head -1); cat "$X" || true; adb logcat -d -t 3000 || true; exit $TEST_EXIT
