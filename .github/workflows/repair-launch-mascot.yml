name: Validate Repera asset catalogs

on:
  push:
    branches: [main]
    paths:
      - "Apps/Repera/Resources/Assets.xcassets/**"
      - "Apps/ReperaWatch/Resources/Assets.xcassets/**"
      - ".github/workflows/repair-launch-mascot.yml"
  pull_request:
    paths:
      - "Apps/Repera/Resources/Assets.xcassets/**"
      - "Apps/ReperaWatch/Resources/Assets.xcassets/**"
      - ".github/workflows/repair-launch-mascot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate all Xcode asset Contents.json files and referenced images
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          roots = (
              Path("Apps/Repera/Resources/Assets.xcassets"),
              Path("Apps/ReperaWatch/Resources/Assets.xcassets"),
          )
          files_checked = 0
          errors = []
          for root in roots:
              if not root.exists():
                  continue
              for manifest in sorted(root.rglob("Contents.json")):
                  files_checked += 1
                  try:
                      data = json.loads(manifest.read_text(encoding="utf-8"))
                  except (UnicodeError, ValueError) as exc:
                      errors.append(f"{manifest}: invalid JSON: {exc}")
                      continue
                  for entry in data.get("images", []):
                      filename = entry.get("filename")
                      if filename and not (manifest.parent / filename).is_file():
                          errors.append(f"{manifest}: missing image {filename}")
                  for entry in data.get("data", []):
                      filename = entry.get("filename")
                      if filename and not (manifest.parent / filename).is_file():
                          errors.append(f"{manifest}: missing data asset {filename}")

          for message in errors:
              print(f"ERROR: {message}")
          if files_checked == 0:
              raise SystemExit("No asset catalogs found")
          if errors:
              raise SystemExit(f"Asset validation failed: {len(errors)} issue(s)")
          print(f"Valid asset Contents.json files: {files_checked}")
          PY
