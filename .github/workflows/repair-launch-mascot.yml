name: Repair Repera launch mascot alpha

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-launch-mascot.yml"
      - "scripts/repair_mascot_alpha.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-launch-mascot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install Pillow
      - name: Install running mascot asset
        run: |
          curl -fLSs --retry 3 "https://at.adobe.com/MECLjs2EqlZcmNID" -o /tmp/repera-running.png
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          im = Image.open("/tmp/repera-running.png").convert("RGBA")
          out = Path("Apps/Repera/Resources/Assets.xcassets/MascotRunning.imageset")
          out.mkdir(exist_ok=True)
          im.save(out / "mascot-running.png", optimize=True)
          (out / "Contents.json").write_text('{"images":[{"filename":"mascot-running.png","idiom":"universal"}],"info":{"author":"xcode","version":1}}\\n')
          PY
      - name: Fill only enclosed alpha holes on splash mascot
        run: |
          python - <<'PY'
          from pathlib import Path
          from scripts.repair_mascot_alpha import repair
          for name in ("MascotWelcome", "MascotHero", "MascotRunning"):
            filename = {"MascotWelcome": "mascot-welcome.png", "MascotHero": "mascot-hero.png", "MascotRunning": "mascot-running.png"}[name]
            path = Path(f"Apps/Repera/Resources/Assets.xcassets/{name}.imageset/{filename}")
            features, pixels = repair(path, True)
            print(f"{name}: repaired {features} enclosed areas / {pixels} pixels")
          PY
      - name: Commit corrected launch mascot, if modified
        run: |
          git add Apps/Repera/Resources/Assets.xcassets/MascotWelcome.imageset/mascot-welcome.png Apps/Repera/Resources/Assets.xcassets/MascotHero.imageset/mascot-hero.png Apps/Repera/Resources/Assets.xcassets/MascotRunning.imageset
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Fix transparent enclosed details in launch mascot"
            git push origin HEAD:main
          fi
