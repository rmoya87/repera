name: AI connection checks
on:
  push:
    branches: [main]
    paths: ['supabase/**', 'web/ai/**', 'tests/oauth/**', '.github/workflows/ai-oauth-ci.yml']
  pull_request:
    paths: ['supabase/**', 'web/ai/**', 'tests/oauth/**', '.github/workflows/ai-oauth-ci.yml']
permissions:
  contents: read
jobs:
  oauth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --prefix tests/oauth
      - run: npm test --prefix tests/oauth
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/repera-ai-connect/index.ts supabase/functions/repera-ai-tokens/index.ts supabase/functions/repera-mcp/index.ts
      - run: deno test --allow-env --allow-read tests/oauth/identity_test.ts
      - run: node --check web/ai/connect.js
