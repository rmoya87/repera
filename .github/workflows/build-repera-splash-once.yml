name: Publish corrected Repera mascot splash assets

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-repera-splash-once.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pillow numpy opencv-python-headless
      - name: Get untouched original hero illustration from Git history
        run: |
          git fetch --depth=50 origin c045bd03569a73db0fe244d8beadeff80fddf2b6
          git show c045bd03569a73db0fe244d8beadeff80fddf2b6:Apps/Repera/Resources/Assets.xcassets/MascotHero.imageset/mascot-hero.png > /tmp/repera-original-hero.png
      - name: Download running body reference
        run: |
          curl --fail --location --silent --show-error --retry 3 "https://at.adobe.com/xC4TcaWuxmqAAQm8" --output /tmp/repera-running-source.png
          python - <<'PY'
          from PIL import Image
          for path in ('/tmp/repera-original-hero.png', '/tmp/repera-running-source.png'):
              with Image.open(path) as im:
                  im.verify()
              print('Valid image source', path)
          PY
      - name: Rebuild matching Repera character illustrations
        run: python scripts/build_repera_splash_assets.py --hero-source /tmp/repera-original-hero.png --running-source /tmp/repera-running-source.png
      - name: Check all facial features and resource manifests
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          root = Path('Apps/Repera/Resources/Assets.xcassets')
          for name, filename in [('MascotHero', 'mascot-hero.png'), ('MascotRunning', 'mascot-running.png')]:
              path = root / (name+'.imageset')
              cfg = json.loads((path/'Contents.json').read_text())
              assert cfg['images'][0]['filename'] == filename
              with Image.open(path / filename) as im:
                  im = im.convert('RGBA')
                  assert im.getpixel((0,0))[3] == 0
                  if name == 'MascotHero':
                      for point in ((444,381),(606,412),(515,440)):
                          assert im.getpixel(point)[3] == 255, (name, point)
              print('Validated', name)
          PY
      - name: Publish PNGs to main and remove one-off build workflow
        run: |
          git add Apps/Repera/Resources/Assets.xcassets/MascotHero.imageset/mascot-hero.png Apps/Repera/Resources/Assets.xcassets/MascotRunning.imageset
          git rm .github/workflows/build-repera-splash-once.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Restore clean solid Repera face and matching running pose from original mascot"
          git push origin HEAD:main
