name: Validate Repera splash artwork and opacity

on:
  push:
    branches: [main]
    paths:
      - "Apps/Repera/Resources/Assets.xcassets/MascotHero.imageset/**"
      - "Apps/Repera/Resources/Assets.xcassets/MascotRunning.imageset/**"
      - "Apps/Repera/Resources/Assets.xcassets/ReperaBarbellLaunch.imageset/**"
      - "Apps/Repera/Resources/LaunchHeroOpaque.png"
      - "Apps/Repera/Resources/Info.plist"
      - "Apps/Repera/Resources/ReperaNativeLaunch.storyboard"
      - "project.yml"
      - ".github/workflows/validate-splash-alpha.yml"
  pull_request:
    paths:
      - "Apps/Repera/Resources/Assets.xcassets/**"
      - "Apps/Repera/Resources/Info.plist"
      - "Apps/Repera/Resources/Info.plist"
      - "project.yml"
      - ".github/workflows/validate-splash-alpha.yml"

jobs:
  verify-native-launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Verify native launch storyboard uses first mascot and brand green
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,plistlib
          from PIL import Image
          root=Path("Apps/Repera/Resources")
          assets=root/"Assets.xcassets"
          manifest=json.loads((assets/"ReperaBarbellLaunch.imageset/Contents.json").read_text())
          assert manifest["images"][0]=={"filename":"repera-barbell-launch.png","idiom":"universal","scale":"3x"}
          image=assets/"ReperaBarbellLaunch.imageset/repera-barbell-launch.png"
          with Image.open(image) as im:
              # Art has a transparent exterior. The native background is the
              # separate brand-green color asset, and eyes/mouth are opaque.
              assert im.mode=="RGBA" and im.width>=800 and im.height>=1600, im.size
              assert im.getpixel((0,0))[3]==0
              assert im.getpixel((im.width//2,im.height//2))[3]>=245
              face=im.crop((260,830,600,1040))
              dark=sum(1 for r,g,b,a in face.getdata()
                       if a>=245 and max(r,g,b)<105)
              assert dark>500, f"Opaque dark eyes/mouth missing: only {dark} pixels"
          colors=json.loads((assets/"LaunchReperaGreen.colorset/Contents.json").read_text())
          rgb=colors["colors"][0]["color"]["components"]
          assert tuple(round(float(rgb[k])*255) for k in ("red","green","blue"))==(48,209,88)
          opaqueDir=assets/"ReperaNativeOpaqueHero.imageset"
          opaqueCfg=json.loads((opaqueDir/"Contents.json").read_text())
          assert opaqueCfg["images"][0]["filename"]=="repera-native-opaque-hero.png"
          with Image.open(opaqueDir/"repera-native-opaque-hero.png") as opaque:
              assert opaque.mode=="RGB" and opaque.size==(850,1850), "Native launch artwork must be fully opaque"
              assert opaque.getpixel((0,0))==(48,209,88)
              face=opaque.crop((250,750,620,1100))
              assert sum(1 for rgb in face.getdata() if max(rgb)<105)>500, "Eyes or mouth lost"
          props=plistlib.loads((root/"Info.plist").read_bytes())
          assert "UILaunchScreen" not in props
          assert props["UILaunchStoryboardName"]=="LaunchScreen"
          import xml.etree.ElementTree as ET
          storyboard=Path("Apps/Repera/Resources/LaunchScreen.storyboard")
          tree=ET.parse(storyboard)
          assert tree.getroot().get("launchScreen")=="YES"
          assert len(tree.findall('.//imageView[@image="ReperaNativeOpaqueHero"]'))==1
          bg=tree.find('.//view/color[@key="backgroundColor"]')
          assert bg is not None and abs(float(bg.get("green"))-209/255)<0.001
          assert len(tree.findall('.//resources/image[@name="ReperaNativeOpaqueHero"]'))==1
          config=Path("project.yml").read_text()
          assert "UILaunchScreen:" not in config
          assert "UILaunchStoryboardName: LaunchScreen" in config
          assert "path: Apps/Repera/Resources/LaunchScreen.storyboard" in config
          # Splash art fills the full native launch window, without scaling
          # down to a small content box or relying on a second overlay.
          constraint_ids={node.attrib.get("id") for node in tree.findall(".//constraint")}
          required={"mascot-leading","mascot-trailing","mascot-top","mascot-bottom"}
          assert required.issubset(constraint_ids), "Native splash mascot not pinned edge-to-edge"
          assert "path: Apps/Repera/Resources/ReperaNativeLaunch.storyboard" not in config
          assert 'path: Apps/Repera/Resources/LaunchScreen.storyboard' in config
          assert 'UILaunchStoryboardName: LaunchScreen' in config
          # Only the built-in launch storyboard is part of the Xcode target.
          assert 'path: Apps/Repera/Resources/ReperaBarbellStartup.storyboard' not in config
          direct=Path("Apps/Repera/Resources/ReperaStartupBarbell.png")
          assert direct.read_bytes()==image.read_bytes(), "First SwiftUI splash differs from native artwork"
          runner=Path("Apps/Repera/Sources/ReperaApp.swift").read_text()
          assert 'launchMascotStage == 0' in runner
          assert 'LaunchBarbellSplashView()' in runner
          assert 'UIImage(named: "MascotRunning")' in runner
          print("PASS: brand-green launch image has opaque facial features; runner unchanged")
          PY
