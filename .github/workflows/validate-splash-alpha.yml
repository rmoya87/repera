name: Validate Repera splash artwork and opacity

on:
  push:
    branches: [main]
    paths:
      - "Apps/Repera/Resources/Assets.xcassets/MascotHero.imageset/**"
      - "Apps/Repera/Resources/Assets.xcassets/MascotRunning.imageset/**"
      - "Apps/Repera/Resources/Assets.xcassets/ReperaLaunchHeroOpaque.imageset/**"
      - "Apps/Repera/Resources/ReperaLaunchOpaque.storyboard"
      - "Apps/Repera/Resources/Info.plist"
      - "project.yml"
      - ".github/workflows/validate-splash-alpha.yml"
  pull_request:
    paths:
      - "Apps/Repera/Resources/Assets.xcassets/**"
      - "Apps/Repera/Resources/ReperaLaunchOpaque.storyboard"
      - "Apps/Repera/Resources/Info.plist"
      - "project.yml"
      - ".github/workflows/validate-splash-alpha.yml"

jobs:
  verify-native-launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Verify no alpha leaks in native iOS splash and exact launch wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree
          import json
          import plistlib
          from PIL import Image

          root=Path("Apps/Repera/Resources")
          catalog=root/"Assets.xcassets"
          native=catalog/"ReperaLaunchHeroOpaque.imageset"
          manifest=json.loads((native/"Contents.json").read_text(encoding="utf-8"))
          assert manifest["images"][0]["filename"]=="repera-launch-hero-opaque.png"
          with Image.open(native/"repera-launch-hero-opaque.png") as im:
              assert im.mode=="RGB", "Native launch must be fully opaque RGB, NOT RGBA"
              assert im.size==(1024,1024)
              assert im.getpixel((0,0))==(48,209,88), "Incorrect Repera green"
              for point in ((445,379),(607,411),(518,445)):
                  pixel=im.getpixel(point)
                  assert max(pixel)<115, f"Eye or smile became green at {point}: {pixel}"
          native_story=root/"ReperaLaunchOpaque.storyboard"
          tree=ElementTree.parse(native_story)
          assert len(tree.findall('.//imageView[@image="ReperaLaunchHeroOpaque"]'))==1
          assert len(tree.findall('.//resources/image[@name="ReperaLaunchHeroOpaque"]'))==1
          assert not (root/"LaunchScreen.storyboard").exists(), "Old storyboard still present"
          plist=plistlib.loads((root/"Info.plist").read_bytes())
          assert plist["UILaunchStoryboardName"]=="ReperaLaunchOpaque"
          project=Path("project.yml").read_text()
          assert "path: Apps/Repera/Resources/ReperaLaunchOpaque.storyboard" in project
          assert "UILaunchStoryboardName: ReperaLaunchOpaque" in project
          # Preserve the second splash's runner.
          app=Path("Apps/Repera/Sources/ReperaApp.swift").read_text()
          assert 'UIImage(named: "MascotRunning")' in app
          print("PASS: opaque eyes/mouth, brand green, unique storyboard, runner unchanged")
          PY
