name: Validate Repera splash artwork and opacity

on:
  push:
    branches: [main]
    paths:
      - "Apps/Repera/Resources/Assets.xcassets/MascotHero.imageset/**"
      - "Apps/Repera/Resources/Assets.xcassets/MascotRunning.imageset/**"
      - "Apps/Repera/Resources/Assets.xcassets/ReperaNativeBarbell.imageset/**"
      - "Apps/Repera/Resources/LaunchHeroOpaque.png"
      - "Apps/Repera/Resources/Info.plist"
      - "Apps/Repera/Resources/Info.plist"
      - "project.yml"
      - ".github/workflows/validate-splash-alpha.yml"
  pull_request:
    paths:
      - "Apps/Repera/Resources/Assets.xcassets/**"
      - "Apps/Repera/Resources/Info.plist"
      - "Apps/Repera/Resources/Info.plist"
      - "project.yml"
      - ".github/workflows/validate-splash-alpha.yml"

jobs:
  verify-native-launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check pillow
      - name: Verify storyboard-free UILaunchScreen, facial pixels and asset references
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,plistlib
          from PIL import Image
          root=Path("Apps/Repera/Resources")
          assets=root/"Assets.xcassets"
          manifest=json.loads((assets/"ReperaNativeBarbell.imageset/Contents.json").read_text())
          assert manifest["images"][0]=={"filename":"repera-native-barbell.png","idiom":"universal","scale":"3x"}
          image=assets/"ReperaNativeBarbell.imageset/repera-native-barbell.png"
          with Image.open(image) as im:
              assert im.mode=="RGB" and im.size==(1024,1024)
              assert im.getpixel((0,0))==(48,209,88), "Launch background color wrong"
              for x,y in ((445,379),(607,411),(518,445)):
                  assert max(im.getpixel((x,y)))<115, f"Eye/mouth is transparent or green at {(x,y)}"
          colors=json.loads((assets/"LaunchBackground.colorset/Contents.json").read_text())
          rgb=colors["colors"][0]["color"]["components"]
          assert tuple(round(float(rgb[k])*255) for k in ("red","green","blue"))==(48,209,88)
          props=plistlib.loads((root/"Info.plist").read_bytes())
          assert "UILaunchStoryboardName" not in props
          assert props["UILaunchScreen"]=={
              "UIImageName":"ReperaNativeBarbell",
              "UIColorName":"LaunchBackground",
              "UIImageRespectsSafeAreaInsets":True
          }
          config=Path("project.yml").read_text()
          assert "UILaunchStoryboardName:" not in config
          assert "UIImageName: ReperaNativeBarbell" in config
          assert "UIColorName: LaunchBackground" in config
          assert "path: Apps/Repera/Resources/ReperaLaunchBundle.storyboard" not in config
          assert "path: Apps/Repera/Resources/LaunchHeroOpaque.png" not in config
          runner=Path("Apps/Repera/Sources/ReperaApp.swift").read_text()
          assert 'UIImage(named: "MascotRunning")' in runner
          print("PASS: native launch from asset catalog; hero opaque; runner unchanged")
          PY
