name: iOS 27 CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/ios27-native-performance-audit
      - fix/ios27-jank-search-reliability
      - feat/repera-business-platform
      - main

concurrency:
  group: ios27-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog-offline-contracts:
    name: Catalog offline / invisible UI contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate native background sync and catalog integrity
        run: |
          python3 -m unittest discover -s tests -p 'test_background_exercise_catalog.py' -v
          python3 - <<'PY'
          from pathlib import Path
          migrations = Path('supabase/migrations')
          assert list(migrations.glob('*mobile_exercise_catalog_events.sql'))
          assert list(migrations.glob('*catalog_event_commit_order.sql'))
          assert list(migrations.glob('*mobile_exercise_equipment_override.sql'))
          assert list(migrations.glob('*ring_dips_kipping_editorial_catalog.sql'))
          print('PASS: migration chain and background contracts present')
          PY

  domain-tests:
    name: ReperaDomain swift test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests (strict concurrency package)
        run: |
          sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer
          swift --version
          swift test --package-path Packages/ReperaDomain
          swift test --package-path mobile-contracts/swift

  canvas:
    name: Modernization canvas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate + regenerate canvas
        run: |
          python3 docs/ios27-modernization/generate_canvas.py --check
          python3 docs/ios27-modernization/generate_canvas.py --write
          git diff --exit-code -- docs/ios27-modernization/canvas.html \
            || (echo 'canvas.html out of date — run generate_canvas.py --write' && exit 1)

  docs:
    name: Docs touchpoints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required docs exist
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f docs/ARCHITECTURE.md
          test -f docs/FEATURES.md
          test -f docs/MAINTENANCE.md
          test -f docs/ios27-modernization/README.md
          test -f docs/decisions/README.md
      - name: Verificar versiones y script de Xcode
        run: |
          python3 scripts/sync_versions.py --check
          python3 -m unittest discover -s tests -p 'test_sync_versions.py' -v
          python3 -m unittest discover -s tests -p 'test_google_identity_linking_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_ai_realtime_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_background_exercise_catalog.py' -v
          python3 -m unittest discover -s tests -p 'test_ai_coach_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_ai_apple_permissions_sync_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_health_physio_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_health_permissions.py' -v
          python3 -m unittest discover -s tests -p 'test_watch_healthkit_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_watch_widget_plist.py' -v
          python3 scripts/check_watch_widget_plist.py
          python3 -m unittest discover -s tests -p 'test_wod_play_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_completed_workout_edit_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_scaled_wod_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_wod_prescription_edit_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_mixed_session_review_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_verified_session_review_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_cross_format_comparisons.py' -v
          python3 -m unittest discover -s tests -p 'test_ai_catalog_metadata.py' -v
          python3 -m unittest discover -s tests -p 'test_mcp_v2_and_scan_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_mcp_wod_format_contract.py' -v
          python3 -m unittest discover -s tests -p 'test_mcp_workout_crud_timezone_contract.py' -v

  xcode-build:
    name: XcodeGen + build + test
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode 27 and require both simulator SDKs
        shell: bash
        run: |
          set -euo pipefail
          sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer
          xcodebuild -version
          xcodebuild -showsdks | tee "$RUNNER_TEMP/repera-sdks.txt"
          grep -Eq 'iphonesimulator27([.]|$)' "$RUNNER_TEMP/repera-sdks.txt" \
            || { echo "::error::iOS 27 Simulator SDK missing on xcode-27 runner"; exit 1; }
          grep -Eq 'watchsimulator27([.]|$)' "$RUNNER_TEMP/repera-sdks.txt" \
            || { echo "::error::watchOS 27 Simulator SDK missing on xcode-27 runner"; exit 1; }
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate --spec project.yml
      - name: Require runnable Apple Watch app scheme
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -list -json -project Repera.xcodeproj > "$RUNNER_TEMP/repera-schemes.json"
          python3 - "$RUNNER_TEMP/repera-schemes.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1], encoding="utf-8"))
          schemes = data.get("project", {}).get("schemes", [])
          if "ReperaWatch" not in schemes:
              raise SystemExit("Missing runnable ReperaWatch scheme; check project.yml")
          print("ReperaWatch scheme present:", ", ".join(schemes))
          PY
      - name: Check Apple and Supabase Auth sources in generated Repera target
        run: |
          python3 scripts/check_xcode_sources.py
          python3 -m unittest discover -s tests -p test_xcode_sources.py -v
          python3 -m unittest discover -s tests -p test_checkout_refresh.py -v
      - name: Parse Swift sources with Xcode 27 compiler
        shell: bash
        run: |
          set -euo pipefail
          find Apps Packages mobile-contracts/swift -name '*.swift' -print0 \
            | xargs -0 xcrun swiftc -frontend -parse
      - name: Build Repera (iOS 27 Simulator)
        shell: bash
        run: |
          set -euo pipefail
          # Do not force -sdk iphonesimulator here: the Repera scheme embeds
          # ReperaWatch, which must retain watchsimulator as its SDK.
          # Xcode 27 + RevenueCat: el SDK externo usa -suppress-warnings.
          # El flag global -warnings-as-errors provoca opciones incompatibles
          # antes de que compile Repera. Swift 6 strict concurrency se mantiene.
          xcodebuild -project Repera.xcodeproj -scheme Repera \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/ReperaDerivedData" \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$RUNNER_TEMP/repera-ios-build.log"
      - name: Compile Apple's standard LaunchScreen.storyboard independently
        shell: bash
        run: |
          set -euo pipefail
          xcrun ibtool --compile "$RUNNER_TEMP/LaunchScreen.storyboardc" Apps/Repera/Resources/LaunchScreen.storyboard
          test -d "$RUNNER_TEMP/LaunchScreen.storyboardc" || {
            echo "::error::LaunchScreen storyboard failed to compile"; exit 1;
          }
          echo "PASS: LaunchScreen.storyboard compiled by Apple's Interface Builder"

      - name: Verify native launch storyboard, mascot and first-frame assets in Repera.app
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/ReperaDerivedData/Build/Products/Debug-iphonesimulator/Repera.app"
          test -f "$APP/Info.plist" || { echo "::error::Compiled app Info.plist missing"; exit 1; }
          test -f "$APP/Assets.car" || { echo "::error::Asset catalog missing"; exit 1; }
          test -d "$APP/LaunchScreen.storyboardc" || {
            echo "::error::Native launch storyboard was not compiled"; exit 1;
          }
          python3 - "$APP/Info.plist" <<'PY'
          import plistlib,sys
          with open(sys.argv[1],"rb") as f:
              info=plistlib.load(f)
          assert info.get("UILaunchStoryboardName")=="LaunchScreen", info.get("UILaunchStoryboardName")
          assert not info.get("UILaunchScreen"), "Blank UILaunchScreen is overriding storyboard"
          print("PASS: native storyboard configured in packaged Info.plist")
          PY
          xcrun assetutil --info "$APP/Assets.car" > "$RUNNER_TEMP/launch-assets.json"
          python3 - "$RUNNER_TEMP/launch-assets.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding="utf-8") as f: entries=json.load(f)
          names={e.get("Name") for e in entries if isinstance(e,dict)}
          assert "ReperaNativeOpaqueHero" in names, "Native splash mascot not in compiled Assets.car"
          print("PASS: ReperaNativeOpaqueHero present in asset catalog")
          # Also validate that the SwiftUI barbell image is compiled separately.
          assert "ReperaBarbellLaunch" in names, "SwiftUI barbell mascot missing"
          PY
          test -f "$APP/ReperaStartupBarbell.png" || {
            echo "::error::SwiftUI barbell is missing from app bundle"; exit 1;
          }
          # Xcode's Copy PNG File build step recompresses png bytes.
          # Comparing bytes is invalid; verify dimensions and a decodable image instead.
          src_dimensions="$(sips -g pixelWidth -g pixelHeight Apps/Repera/Resources/ReperaStartupBarbell.png | grep -E 'pixelWidth|pixelHeight' | tr -d '[:space:]')"
          app_dimensions="$(sips -g pixelWidth -g pixelHeight "$APP/ReperaStartupBarbell.png" | grep -E 'pixelWidth|pixelHeight' | tr -d '[:space:]')"
          test "$src_dimensions" = "$app_dimensions" || {
            echo "::error::Bundled SwiftUI mascot has different image dimensions"; exit 1;
          }
          echo "PASS: bundled barbell PNG decodes at expected dimensions"
          echo "PASS: native launch and first SwiftUI frame use matching art"

      - name: Build ReperaWatch (watchOS 27 Simulator)
        shell: bash
        run: |
          # La etiqueta del modelo incluye paréntesis: extraer el UDID con awk
          # devolvía "46mm" en vez del UUID. El destino genérico es
          # suficiente para compilar watchOS y evita depender de un simulador.
          xcodebuild -project Repera.xcodeproj -scheme ReperaWatch \
            -configuration Debug \
            -destination "generic/platform=watchOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/ReperaDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            -quiet build
      - name: Verify packaged Watch widget Info.plist before simulator install
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_watch_widget_plist.py
          WIDGET_PLIST="$(find "$RUNNER_TEMP/ReperaDerivedData/Build/Products" \
            -path '*/ReperaWatchWidget.appex/Info.plist' -print -quit)"
          if [[ -z "$WIDGET_PLIST" ]]; then
            echo "::error::ReperaWatchWidget.appex/Info.plist no existe en los productos de compilación"
            exit 1
          fi
          python3 scripts/check_watch_widget_plist.py --built "$WIDGET_PLIST"
      - name: UI tests (scheme Repera — fail hard)
        run: |
          set -euo pipefail
          DEST="$(xcrun simctl list devices available -j | python3 -c '
          import json,sys
          d=json.load(sys.stdin)["devices"]
          choices=[x for runtime,devices in d.items() if "iOS-27" in runtime
                     for x in devices if x.get("isAvailable", True) and x["name"].startswith("iPhone")]
          choices.sort(key=lambda x: ("iPhone 17e" not in x["name"], x["name"]))
          print(choices[0]["udid"] if choices else "")
          ')"
          if [[ -z "$DEST" ]]; then
            echo "::error::No available iOS 27 iPhone simulator"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Selected iOS 27 simulator: $DEST"
          xcodebuild -project Repera.xcodeproj -scheme Repera \
            -destination "platform=iOS Simulator,id=$DEST" \
            -derivedDataPath "$RUNNER_TEMP/ReperaDerivedData" \
            -resultBundlePath "$RUNNER_TEMP/ReperaUITests.xcresult" \
            CODE_SIGNING_ALLOWED=NO test 2>&1 | tee "$RUNNER_TEMP/repera-ui-tests.log"
      - name: Upload xcresult
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repera-ui-xcresult
          path: |
            ${{ runner.temp }}/ReperaUITests.xcresult
            ${{ runner.temp }}/repera-ios-build.log
            ${{ runner.temp }}/repera-watch-build.log
            ${{ runner.temp }}/repera-ui-tests.log
          if-no-files-found: ignore
