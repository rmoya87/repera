name: iOS 27 CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - feat/ios27-native-performance-audit
      - main

concurrency:
  group: ios27-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain-tests:
    name: GymbroDomain swift test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift tests (strict concurrency package)
        run: |
          cd Packages/GymbroDomain
          swift test

  canvas:
    name: Modernization canvas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate + regenerate canvas
        run: |
          python3 docs/ios27-modernization/generate_canvas.py --check
          python3 docs/ios27-modernization/generate_canvas.py --write
          git diff --exit-code -- docs/ios27-modernization/canvas.html \
            || (echo 'canvas.html out of date — run generate_canvas.py --write' && exit 1)

  docs:
    name: Docs touchpoints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required docs exist
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f docs/ARCHITECTURE.md
          test -f docs/FEATURES.md
          test -f docs/MAINTENANCE.md
          test -f docs/ios27-modernization/README.md
          test -f docs/decisions/README.md

  xcode-build:
    name: XcodeGen + build iOS/Watch/Widget
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          # Prefer newest installed Xcode; fail clearly if iOS 27 SDK missing.
          ls /Applications | grep -i Xcode || true
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || true
          xcodebuild -version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build Gymbro (iOS Simulator)
        run: |
          DEST=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone 17e/{print $2; exit}')
          if [ -z "$DEST" ]; then
            DEST=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/{print $2; exit}')
          fi
          echo "Using simulator $DEST"
          xcodebuild -scheme Gymbro \
            -destination "platform=iOS Simulator,id=$DEST" \
            -quiet build
      - name: Build GymbroWatch
        run: |
          DEST=$(xcrun simctl list devices available | awk -F '[()]' '/Apple Watch Series 12/{print $2; exit}')
          if [ -z "$DEST" ]; then
            DEST=$(xcrun simctl list devices available | awk -F '[()]' '/Apple Watch/{print $2; exit}')
          fi
          echo "Using watch simulator $DEST"
          xcodebuild -scheme GymbroWatch \
            -destination "platform=watchOS Simulator,id=$DEST" \
            -quiet build
      # UI tests: target may be absent on older agents — keep optional until G27-026 lands in CI runners.
      - name: UI tests (optional)
        continue-on-error: true
        run: |
          if xcodebuild -list | grep -q GymbroUITests; then
            DEST=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone 17e/{print $2; exit}')
            xcodebuild -scheme GymbroUITests \
              -destination "platform=iOS Simulator,id=$DEST" \
              test
          else
            echo "GymbroUITests target not present — skip"
          fi
