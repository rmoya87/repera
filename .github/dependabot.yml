# Security/compatibility dependency update PRs. No automatic merging or publishing.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:30'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Europe/Madrid
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /web/console
    schedule:
      interval: weekly
      day: monday
      time: '07:30'
      timezone: Europe/Madrid
    open-pull-requests-limit: 3
