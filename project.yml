name: Repera
options:
  bundleIdPrefix: com.app
  # Salvamos los cambios realizados en Xcode ANTES de regenerar el proyecto.
  preGenCommand: python3 scripts/sync_versions.py --from-project
  deploymentTarget:
    iOS: "26.0"
    watchOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

fileGroups:
  - Configs/Version.xcconfig
  - Configs/GoogleSignIn.xcconfig

packages:
  ReperaDomain:
    path: Packages/ReperaDomain
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.55.4
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    exactVersion: 10.1.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk.git
    from: 12.0.0

configFiles:
  Debug: Configs/Version.xcconfig
  Release: Configs/Version.xcconfig

settings:
  # Valores compartidos: ningún target debe declarar otra versión.
  MARKETING_VERSION: "$(REPERA_MARKETING_VERSION)"
  CURRENT_PROJECT_VERSION: "$(REPERA_BUILD_NUMBER)"
  BASE_SDK: iphoneos
  SWIFT_VERSION: "6.0"
  SWIFT_STRICT_CONCURRENCY: complete
  TARGETED_DEVICE_FAMILY: "1"
  DEVELOPMENT_TEAM: 9DTDGQ8UUQ
  CODE_SIGN_STYLE: Automatic
  # App + framework dSYMs for Organizer / App Store Connect symbol upload.
  DEBUG_INFORMATION_FORMAT: dwarf-with-dsym

targets:
  Repera:
    type: application
    platform: iOS
    sources:
      # XcodeGen must register this new file in Repera / Compile Sources.
      # Listing it separately prevents old or incomplete directory grouping
      # from silently excluding the Supabase editorial catalog store.
      - path: Apps/Repera/Sources
        excludes:
          - RemoteExerciseCatalogStore.swift
          - RemoteExerciseArtCache.swift
          - LiveActivityView.swift
          - LiveActivityLocationName.swift
          - WorkoutLiveActivityCoordinator.swift
          - LiveSportHistoryView.swift
          - OGDuoContextRail.swift
          - PlusHubView.swift
          - SessionDetailSkeleton.swift
          - ProgressHubSkeleton.swift
          - Analytics/ReperaAnalytics.swift
          - StrengthBenchmarkCard.swift
          - StrengthContributionSubmitter.swift
          - StrengthBenchmarkRemoteStore.swift
      - path: Apps/Repera/Sources/RemoteExerciseCatalogStore.swift
      - path: Apps/Repera/Sources/RemoteExerciseArtCache.swift
      # Referencias explícitas: XcodeGen no puede omitir estas fuentes del target.
      - path: Apps/Repera/Sources/LiveActivityView.swift
      - path: Apps/Repera/Sources/LiveActivityLocationName.swift
      - path: Apps/Repera/Sources/WorkoutLiveActivityCoordinator.swift
      - path: Apps/Repera/Sources/LiveSportHistoryView.swift
      - path: Apps/Repera/Sources/OGDuoContextRail.swift
      - path: Apps/Repera/Sources/PlusHubView.swift
      - path: Apps/Repera/Sources/SessionDetailSkeleton.swift
      - path: Apps/Repera/Sources/ProgressHubSkeleton.swift
      # GA4 adapter: new Analytics/ folder is easy for XcodeGen 2.46 to drop from Compile Sources.
      - path: Apps/Repera/Sources/StrengthBenchmarkCard.swift
      - path: Apps/Repera/Sources/StrengthContributionSubmitter.swift
      - path: Apps/Repera/Sources/StrengthBenchmarkRemoteStore.swift
      - path: Apps/Repera/Sources/WorkoutUIComponents.swift
      - path: Apps/Repera/Sources/Analytics/ReperaAnalytics.swift
      - path: Apps/Shared/RestActivityAttributes.swift
      - path: Apps/Shared/TrainingActivityAttributes.swift
      - path: Apps/Shared/ReperaControlOpenIntent.swift
      - path: Apps/Shared/TrainingLiveActivityIntents.swift
      - path: Apps/Shared/ReperaShareInbox.swift
      - path: Apps/Shared/AppleWeatherConditionsClient.swift
      - path: Apps/Shared/AppleWeatherAttributionView.swift
      # XcodeGen 2.46 + objectVersion 77 omite `resources:`; hay que declarar assets a mano.
      - path: Apps/Repera/Resources/Assets.xcassets
        buildPhase: resources
      - path: Apps/Repera/Resources/ReperaStartupBarbell.png
        buildPhase: resources
      - path: Apps/Repera/Resources/ExerciseArt
        buildPhase: resources
        type: folder
      # El sistema renderiza el LaunchScreen nativo mientras SwiftUI inicia.
      # El storyboard nativo y el primer frame SwiftUI usan ReperaNativeOpaqueHero.
      - path: Apps/Repera/Resources/LaunchScreen.storyboard
        buildPhase: resources
      - path: Apps/Repera/Resources/BodyPaths.json
        buildPhase: resources
      - path: Apps/Repera/Resources/strength_benchmarks.json
        buildPhase: resources
      # The Firebase config is optional for local builds and bundled only when provided.
      - path: Apps/Repera/Resources
        includes:
          - GoogleService-Info.plist
        buildPhase: resources
    resources: []
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.app.repera
      # Las configuraciones del target heredan la versión compartida del proyecto.
      MARKETING_VERSION: "$(inherited)"
      CURRENT_PROJECT_VERSION: "$(inherited)"
      INFOPLIST_FILE: Apps/Repera/Resources/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1"
      GENERATE_INFOPLIST_FILE: false
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 9DTDGQ8UUQ
      SWIFT_EMIT_MODULE_INTERFACE: NO
      OTHER_LDFLAGS: "$(inherited) -ObjC"
      CODE_SIGN_ENTITLEMENTS: Apps/Repera/Resources/Repera.entitlements
    entitlements:
      path: Apps/Repera/Resources/Repera.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.weatherkit: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.app.repera
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.app.repera
        com.apple.security.application-groups:
          - group.com.app.repera
    dependencies:
      - package: ReperaDomain
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      # Analytics-only, no IDFA product. Not linked on watchOS.
      - package: Firebase
        product: FirebaseAnalyticsCore
      - target: ReperaWatch
        embed: true
      - target: ReperaRestWidget
        embed: true
      - target: ReperaShare
        embed: true
      - sdk: HealthKit.framework
      - sdk: WorkoutKit.framework
      - sdk: WeatherKit.framework
      - sdk: FoundationModels.framework
      - sdk: ActivityKit.framework
      - sdk: CoreLocation.framework
      - sdk: MapKit.framework
      - sdk: EventKit.framework
      - sdk: MediaPlayer.framework
      - sdk: AuthenticationServices.framework
    # Firebase Analytics / GoogleAppMeasurement SPM binaries ship without public dSYMs.
    # Invoke the .sh via SCRIPT_INPUT_FILE_0 (User Script Sandboxing blocks bare exec of
    # PROJECT_DIR/scripts/*.sh → "Operation not permitted"). Soft-fail: Archive post-action
    # is the reliable pass. Avoid XcodeGen `path:` (inlines a stale copy into pbxproj).
    postBuildScripts:
      - name: Embed framework dSYMs in archive
        shell: /bin/bash
        script: |
          set -uo pipefail
          SCRIPT="${SCRIPT_INPUT_FILE_0:-${PROJECT_DIR}/scripts/embed_ios_archive_dsyms.sh}"
          if [[ ! -f "${SCRIPT}" ]]; then
            echo "note: embed dSYM script missing at ${SCRIPT}; Archive post-action will embed."
            exit 0
          fi
          /bin/bash "${SCRIPT}" || {
            echo "note: embed_ios_archive_dsyms soft-failed ($?); Archive post-action will embed."
            exit 0
          }
        inputFiles:
          - $(SRCROOT)/scripts/embed_ios_archive_dsyms.sh
        runOnlyWhenInstalling: true
        basedOnDependencyAnalysis: false
        showEnvVars: false
    info:
      path: Apps/Repera/Resources/Info.plist
      properties:
        CFBundleDisplayName: Repera
        # Collection stays off until configure() finds GoogleService-Info; no ad personalization.
        FIREBASE_ANALYTICS_COLLECTION_ENABLED: false
        FirebaseAutomaticScreenReportingEnabled: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        GIDClientID: "$(REPERA_GOOGLE_IOS_CLIENT_ID)"
        GIDServerClientID: "$(REPERA_GOOGLE_SERVER_CLIENT_ID)"
        CFBundleURLTypes:
          - CFBundleURLName: com.app.repera.auth
            CFBundleURLSchemes:
              - repera
          - CFBundleURLName: com.app.repera.google
            CFBundleURLSchemes:
              - "$(REPERA_GOOGLE_REVERSED_CLIENT_ID)"
        CFBundleDocumentTypes:
          - CFBundleTypeName: GPX Route
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.topografixix.gpx
              - public.xml
          - CFBundleTypeName: Board Image
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.image
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.topografixix.gpx
            UTTypeDescription: GPS Exchange Format
            UTTypeConformsTo:
              - public.xml
              - public.data
            UTTypeTagSpecification:
              public.filename-extension:
                - gpx
              public.mime-type:
                - application/gpx+xml
                - application/xml
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ReperaSupabaseURL: https://uvzgujlrqohreoucirms.supabase.co
        ReperaSupabasePublishableKey: sb_publishable_uY9c82Ur7VK4VOo9n2zCEg_PmywmLbA
        UILaunchStoryboardName: LaunchScreen
        # Native BGAppRefreshTask (system-scheduled, never a foreground spinner).
        BGTaskSchedulerPermittedIdentifiers:
          - com.app.repera.catalog.refresh
        # GPS mientras una ruta está activa y sincronización oportunista.
        # Los avisos y locuciones puntuales no justifican audio persistente.
        UIBackgroundModes:
          - fetch
          - location
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false
        ITSAppUsesNonExemptEncryption: false
        # Home Screen Quick Actions — misma cuaterna que Android (icono largo).
        # Solo navegación; sensores/HealthKit arrancan en la UI autenticada.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.app.repera.quick.today
            UIApplicationShortcutItemTitle: Entreno de hoy
            UIApplicationShortcutItemSubtitle: Abrir el entrenamiento de hoy
            UIApplicationShortcutItemIconSymbolName: figure.strengthtraining.traditional
          - UIApplicationShortcutItemType: com.app.repera.quick.live
            UIApplicationShortcutItemTitle: Comenzar
            UIApplicationShortcutItemSubtitle: Abrir el registro de actividad
            UIApplicationShortcutItemIconSymbolName: play.circle
          - UIApplicationShortcutItemType: com.app.repera.quick.timer
            UIApplicationShortcutItemTitle: Temporizador
            UIApplicationShortcutItemSubtitle: Abrir el temporizador
            UIApplicationShortcutItemIconSymbolName: timer
          - UIApplicationShortcutItemType: com.app.repera.quick.exercises
            UIApplicationShortcutItemTitle: Ejercicios
            UIApplicationShortcutItemSubtitle: Buscar en el catálogo de ejercicios
            UIApplicationShortcutItemIconSymbolName: dumbbell
        # CanOpenURL para «Conecta tu IA» (ChatGPT / Claude / Grok).
        LSApplicationQueriesSchemes:
          - chatgpt
          - claude
          - grok
        NSCalendarsWriteOnlyAccessUsageDescription: Repera puede añadir tus reservas de Center confirmadas al Calendario del sistema, sin leer otros eventos.
        NSCameraUsageDescription: Repera usa la cámara para leer ejercicios de una pizarra o TV y montar la sesión.
        NSPhotoLibraryUsageDescription: Repera lee fotos de pizarras o pantallas para importar el entrenamiento.
        NSHealthShareUsageDescription: Repera lee con tu permiso pasos, calorías activas, entrenamientos, pulsaciones, zonas cardíacas y, si los autorizas, sueño, variabilidad cardíaca, pulso en reposo, respiración, oxígeno y temperatura nocturna para mostrar actividad, objetivos y recuperación. Estos datos de Salud se analizan en tu iPhone y no se envían a Supabase.
        NSHealthUpdateUsageDescription: Repera guarda el entreno en Apple Salud usando las calorías y el tiempo que reporta Salud / Apple Watch.
        NSLocationWhenInUseUsageDescription: Repera utiliza el GPS durante una actividad en vivo, incluso con la pantalla bloqueada, para registrar distancia y recorrido y seguir rutas guardadas.
        NSLocationTemporaryUsageDescriptionDictionary:
          WorkoutPreciseLocation: Repera usa ubicación precisa para el pin del gym y la ruta del entreno.
        NSUbiquitousContainers:
          iCloud.com.app.repera:
            NSUbiquitousContainerIsDocumentScopePublic: false
            NSUbiquitousContainerName: Repera
            NSUbiquitousContainerSupportedFolderLevels: Any

  ReperaRestWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/ReperaRestWidget
      - path: Apps/Shared/RestActivityAttributes.swift
      - path: Apps/Shared/TrainingActivityAttributes.swift
      - path: Apps/Shared/ReperaControlOpenIntent.swift
      - path: Apps/Shared/TrainingLiveActivityIntents.swift
      # El logotipo corporativo se empaqueta también en la extensión WidgetKit;
      # los assets de la app no son visibles automáticamente desde otra bundle.
      - path: Apps/Repera/Resources/Assets.xcassets
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.app.repera.ReperaRestWidget
      # Las configuraciones del target heredan la versión compartida del proyecto.
      MARKETING_VERSION: "$(inherited)"
      CURRENT_PROJECT_VERSION: "$(inherited)"
      INFOPLIST_FILE: Apps/ReperaRestWidget/Info.plist
      GENERATE_INFOPLIST_FILE: false
      TARGETED_DEVICE_FAMILY: "1"
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 9DTDGQ8UUQ
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    info:
      path: Apps/ReperaRestWidget/Info.plist
      properties:
        CFBundleDisplayName: Repera Rest
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  ReperaShare:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/ReperaShare
      - path: Apps/Shared/ReperaShareInbox.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.app.repera.share
      MARKETING_VERSION: "$(inherited)"
      CURRENT_PROJECT_VERSION: "$(inherited)"
      INFOPLIST_FILE: Apps/ReperaShare/Info.plist
      GENERATE_INFOPLIST_FILE: false
      TARGETED_DEVICE_FAMILY: "1"
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 9DTDGQ8UUQ
      CODE_SIGN_ENTITLEMENTS: Apps/ReperaShare/ReperaShare.entitlements
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    entitlements:
      path: Apps/ReperaShare/ReperaShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.app.repera
    dependencies:
      - sdk: UniformTypeIdentifiers.framework
    info:
      path: Apps/ReperaShare/Info.plist
      properties:
        CFBundleDisplayName: Repera
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsFileWithMaxCount: 1

  ReperaWatch:
    type: application
    platform: watchOS
    sources:
      - path: Apps/ReperaWatch/Sources
      - path: Apps/Shared/AppleWeatherConditionsClient.swift
      - path: Apps/Shared/AppleWeatherAttributionView.swift
      - path: Apps/ReperaWatchWidget/ReperaComplicationSharedStore.swift
      # XcodeGen 2.46 + objectVersion 77: asset catalogs van en sources buildPhase resources.
      - path: Apps/ReperaWatch/Resources/Assets.xcassets
        buildPhase: resources
    resources:
      - path: Apps/ReperaWatch/Resources
        excludes:
          - Info.plist
          - Assets.xcassets
          - ReperaWatch.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.app.repera.watchkitapp
      # Las configuraciones del target heredan la versión compartida del proyecto.
      MARKETING_VERSION: "$(inherited)"
      CURRENT_PROJECT_VERSION: "$(inherited)"
      INFOPLIST_FILE: Apps/ReperaWatch/Resources/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: false
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 9DTDGQ8UUQ
      SDKROOT: watchos
      CODE_SIGN_ENTITLEMENTS: Apps/ReperaWatch/Resources/ReperaWatch.entitlements
    entitlements:
      path: Apps/ReperaWatch/Resources/ReperaWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.weatherkit: true
        com.apple.security.application-groups:
          - group.com.app.repera.watch
    dependencies:
      - package: ReperaDomain
      - sdk: HealthKit.framework
      - sdk: WeatherKit.framework
      - target: ReperaWatchWidget
        embed: true
    info:
      path: Apps/ReperaWatch/Resources/Info.plist
      properties:
        CFBundleDisplayName: Repera
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.app.repera
        WKRunsIndependentlyOfCompanionApp: true
        WKSupportsAlwaysOnDisplay: true
        WKSupportsLiveActivityLaunchAttributeTypes: []
        NSMotionUsageDescription: Repera usa el movimiento del Watch para contar repeticiones durante el entrenamiento.
        NSHealthShareUsageDescription: Repera lee durante el entrenamiento tus pulsaciones, las calorías activas y las métricas verificadas por Apple Salud. Estos datos permanecen en tus dispositivos.
        NSHealthUpdateUsageDescription: Repera guarda en Apple Salud el entrenamiento registrado por el reloj, con las mediciones calculadas por HealthKit.
        WKBackgroundModes:
          - workout-processing
        CFBundleURLTypes:
          - CFBundleURLName: com.app.repera.watch
            CFBundleURLSchemes:
              - repera-watch

  ReperaWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: Apps/ReperaWatchWidget/ReperaWatchWidget.swift
      - path: Apps/ReperaWatchWidget/ReperaComplicationSharedStore.swift
      # ReperaIcon/repera.png es idéntico al AppIcon del target ReperaWatch.
      - path: Apps/ReperaWatchWidget/Assets.xcassets
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.app.repera.watchkitapp.widget
      MARKETING_VERSION: "$(inherited)"
      CURRENT_PROJECT_VERSION: "$(inherited)"
      INFOPLIST_FILE: Apps/ReperaWatchWidget/Info.plist
      GENERATE_INFOPLIST_FILE: false
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 9DTDGQ8UUQ
      CODE_SIGN_ENTITLEMENTS: Apps/ReperaWatchWidget/ReperaWatchWidget.entitlements
    entitlements:
      path: Apps/ReperaWatchWidget/ReperaWatchWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.app.repera.watch
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Apps/ReperaWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Repera
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: ReperaWatch
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  ReperaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Apps/ReperaUITests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.app.repera.uitests
      GENERATE_INFOPLIST_FILE: true
      TARGETED_DEVICE_FAMILY: "1"
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 9DTDGQ8UUQ
      TEST_TARGET_NAME: Repera
    dependencies:
      - target: Repera

schemes:
  # Esquema ejecutable para elegir Apple Watch como destino de Run en Xcode.
  # El target ReperaWatchWidget es solo la complicación, no la app.
  ReperaWatch:
    build:
      targets:
        ReperaWatch: all
    run:
      config: Debug
      executable: ReperaWatch
  Repera:
    # Xcode ejecuta esta acción antes de compilar y preserva las versiones
    # introducidas en el proyecto (Build Settings o General del target Repera).
    preActions:
      - name: Guardar versión de Xcode
        settingsTarget: Repera
        script: |
          python3 "$SRCROOT/scripts/sync_versions.py" --from-env
    build:
      targets:
        Repera: all
        ReperaWatch: all
        ReperaRestWidget: all
        ReperaShare: all
    run:
      config: Debug
      executable: Repera
    test:
      targets:
        - ReperaUITests
    archive:
      config: Release
      # Safety net: .xcarchive already exists; fill any Firebase/Google dSYMs the
      # install-time build phase missed so App Store Connect stops warning.
      postActions:
        - name: Embed framework dSYMs in archive
          settingsTarget: Repera
          script: |
            LOG="${TMPDIR:-/tmp}/repera_archive_dsyms.log"
            "${PROJECT_DIR}/scripts/embed_ios_archive_dsyms.sh" --archive "${ARCHIVE_PATH}" > "${LOG}" 2>&1 || true
            echo "note: archive dSYM embed log → ${LOG}"
