name: Repera
options:
  bundleIdPrefix: com.app
  # Salvamos los cambios realizados en Xcode ANTES de regenerar el proyecto.
  preGenCommand: python3 scripts/sync_versions.py --from-project
  deploymentTarget:
    iOS: "27.0"
    watchOS: "27.0"
  createIntermediateGroups: true
  groupSortPosition: top

fileGroups:
  - Configs/Version.xcconfig
  - Configs/GoogleSignIn.xcconfig

packages:
  ReperaDomain:
    path: Packages/ReperaDomain
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios-spm
    from: 5.0.0
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.55.4
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS.git
    exactVersion: 10.1.0

configFiles:
  Debug: Configs/Version.xcconfig
  Release: Configs/Version.xcconfig

settings:
  # Valores compartidos: ningún target debe declarar otra versión.
  MARKETING_VERSION: "$(REPERA_MARKETING_VERSION)"
  CURRENT_PROJECT_VERSION: "$(REPERA_BUILD_NUMBER)"
  BASE_SDK: iphoneos
  SWIFT_VERSION: "6.0"
  SWIFT_STRICT_CONCURRENCY: complete
  TARGETED_DEVICE_FAMILY: "1"
  DEVELOPMENT_TEAM: 9DTDGQ8UUQ
  CODE_SIGN_STYLE: Automatic

targets:
  Repera:
    type: application
    platform: iOS
    sources:
      - path: Apps/Repera/Sources
      - path: Apps/Shared/RestActivityAttributes.swift
      # XcodeGen 2.46 + objectVersion 77 omite `resources:`; hay que declarar assets a mano.
      - path: Apps/Repera/Resources/Assets.xcassets
        buildPhase: resources
      - path: Apps/Repera/Resources/ReperaStartupBarbell.png
        buildPhase: resources
      - path: Apps/Repera/Resources/ExerciseArt
        buildPhase: resources
        type: folder
      # El sistema renderiza el LaunchScreen nativo mientras SwiftUI inicia.
      # El storyboard usa ReperaBarbellLaunch (Asset Catalog), mismo muñeco que SwiftUI.
      - path: Apps/Repera/Resources/LaunchScreen.storyboard
        buildPhase: resources
      - path: Apps/Repera/Resources/BodyPaths.json
        buildPhase: resources
    resources: []
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.app.repera
      # Las configuraciones del target heredan la versión compartida del proyecto.
      MARKETING_VERSION: "$(inherited)"
      CURRENT_PROJECT_VERSION: "$(inherited)"
      INFOPLIST_FILE: Apps/Repera/Resources/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      TARGETED_DEVICE_FAMILY: "1"
      GENERATE_INFOPLIST_FILE: false
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 9DTDGQ8UUQ
      SWIFT_EMIT_MODULE_INTERFACE: NO
      CODE_SIGN_ENTITLEMENTS: Apps/Repera/Resources/Repera.entitlements
    entitlements:
      path: Apps/Repera/Resources/Repera.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.weatherkit: true
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.app.repera
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.com.app.repera
    dependencies:
      - package: ReperaDomain
      - package: RevenueCat
        product: RevenueCat
      - package: Supabase
        product: Supabase
      - package: GoogleSignIn
        product: GoogleSignIn
      - target: ReperaWatch
        embed: true
      - target: ReperaRestWidget
        embed: true
      - sdk: HealthKit.framework
      - sdk: WeatherKit.framework
      - sdk: FoundationModels.framework
      - sdk: ActivityKit.framework
      - sdk: CoreLocation.framework
      - sdk: MapKit.framework
      - sdk: AuthenticationServices.framework
    info:
      path: Apps/Repera/Resources/Info.plist
      properties:
        CFBundleDisplayName: Repera
        GIDClientID: "$(REPERA_GOOGLE_IOS_CLIENT_ID)"
        GIDServerClientID: "$(REPERA_GOOGLE_SERVER_CLIENT_ID)"
        CFBundleURLTypes:
          - CFBundleURLName: com.app.repera.auth
            CFBundleURLSchemes:
              - repera
          - CFBundleURLName: com.app.repera.google
            CFBundleURLSchemes:
              - "$(REPERA_GOOGLE_REVERSED_CLIENT_ID)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        # Clave pública RevenueCat (`appl_…`). Sustituir en ASC / xcconfig; vacío = modo gratis.
        RevenueCatPublicAPIKey: YOUR_REVENUECAT_PUBLIC_API_KEY
        ReperaSupabaseURL: https://uvzgujlrqohreoucirms.supabase.co
        ReperaSupabasePublishableKey: sb_publishable_uY9c82Ur7VK4VOo9n2zCEg_PmywmLbA
        UILaunchStoryboardName: LaunchScreen
        # Native BGAppRefreshTask (system-scheduled, never a foreground spinner).
        BGTaskSchedulerPermittedIdentifiers:
          - com.app.repera.catalog.refresh
        UIBackgroundModes:
          - fetch
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        UIFileSharingEnabled: false
        LSSupportsOpeningDocumentsInPlace: false
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Repera usa la cámara para leer ejercicios de una pizarra o TV y montar la sesión.
        NSPhotoLibraryUsageDescription: Repera lee fotos de pizarras o pantallas para importar el entrenamiento.
        NSHealthShareUsageDescription: Repera lee con tu permiso pasos, calorías activas, entrenamientos, pulsaciones, zonas cardíacas y, si los autorizas, sueño, variabilidad cardíaca, pulso en reposo, respiración, oxígeno y temperatura nocturna para mostrar actividad, objetivos y recuperación. Estos datos de Salud se analizan en tu iPhone y no se envían a Supabase.
        NSHealthUpdateUsageDescription: Repera guarda el entreno en Apple Salud usando las calorías y el tiempo que reporta Salud / Apple Watch.
        NSLocationWhenInUseUsageDescription: Repera usa tu ubicación para mostrar en el mapa dónde entrenaste y, en entrenos outdoor, el recorrido.
        NSLocationTemporaryUsageDescriptionDictionary:
          WorkoutPreciseLocation: Repera usa ubicación precisa para el pin del gym y la ruta del entreno.
        NSUbiquitousContainers:
          iCloud.com.app.repera:
            NSUbiquitousContainerIsDocumentScopePublic: false
            NSUbiquitousContainerName: Repera
            NSUbiquitousContainerSupportedFolderLevels: Any

  ReperaRestWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/ReperaRestWidget
      - path: Apps/Shared/RestActivityAttributes.swift
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.app.repera.ReperaRestWidget
      # Las configuraciones del target heredan la versión compartida del proyecto.
      MARKETING_VERSION: "$(inherited)"
      CURRENT_PROJECT_VERSION: "$(inherited)"
      INFOPLIST_FILE: Apps/ReperaRestWidget/Info.plist
      GENERATE_INFOPLIST_FILE: false
      TARGETED_DEVICE_FAMILY: "1"
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 9DTDGQ8UUQ
      LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
      - sdk: ActivityKit.framework
    info:
      path: Apps/ReperaRestWidget/Info.plist
      properties:
        CFBundleDisplayName: Repera Rest
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  ReperaWatch:
    type: application
    platform: watchOS
    sources:
      - path: Apps/ReperaWatch/Sources
      # XcodeGen 2.46 + objectVersion 77: asset catalogs van en sources buildPhase resources.
      - path: Apps/ReperaWatch/Resources/Assets.xcassets
        buildPhase: resources
    resources:
      - path: Apps/ReperaWatch/Resources
        excludes:
          - Info.plist
          - Assets.xcassets
          - ReperaWatch.entitlements
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.app.repera.watchkitapp
      # Las configuraciones del target heredan la versión compartida del proyecto.
      MARKETING_VERSION: "$(inherited)"
      CURRENT_PROJECT_VERSION: "$(inherited)"
      INFOPLIST_FILE: Apps/ReperaWatch/Resources/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      GENERATE_INFOPLIST_FILE: false
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 9DTDGQ8UUQ
      SDKROOT: watchos
      CODE_SIGN_ENTITLEMENTS: Apps/ReperaWatch/Resources/ReperaWatch.entitlements
    entitlements:
      path: Apps/ReperaWatch/Resources/ReperaWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    dependencies:
      - package: ReperaDomain
      - sdk: HealthKit.framework
      - target: ReperaWatchWidget
        embed: true
    info:
      path: Apps/ReperaWatch/Resources/Info.plist
      properties:
        CFBundleDisplayName: Repera
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.app.repera
        WKRunsIndependentlyOfCompanionApp: true
        NSMotionUsageDescription: Repera usa el movimiento del Watch para contar repeticiones durante el entrenamiento.
        NSHealthShareUsageDescription: Repera lee durante el entrenamiento tus pulsaciones, las calorías activas y las métricas verificadas por Apple Salud. Estos datos permanecen en tus dispositivos.
        NSHealthUpdateUsageDescription: Repera guarda en Apple Salud el entrenamiento registrado por el reloj, con las mediciones calculadas por HealthKit.
        WKBackgroundModes:
          - workout-processing

  ReperaWatchWidget:
    type: app-extension
    platform: watchOS
    sources:
      - path: Apps/ReperaWatchWidget/ReperaWatchWidget.swift
      - path: Apps/ReperaWatchWidget/Assets.xcassets
        buildPhase: resources
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.app.repera.watchkitapp.widget
      MARKETING_VERSION: "$(inherited)"
      CURRENT_PROJECT_VERSION: "$(inherited)"
      INFOPLIST_FILE: Apps/ReperaWatchWidget/Info.plist
      GENERATE_INFOPLIST_FILE: false
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 9DTDGQ8UUQ
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Apps/ReperaWatchWidget/Info.plist
      properties:
        CFBundleDisplayName: Repera
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: ReperaWatch
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  ReperaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Apps/ReperaUITests
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.app.repera.uitests
      GENERATE_INFOPLIST_FILE: true
      TARGETED_DEVICE_FAMILY: "1"
      CODE_SIGN_STYLE: Automatic
      DEVELOPMENT_TEAM: 9DTDGQ8UUQ
      TEST_TARGET_NAME: Repera
    dependencies:
      - target: Repera

schemes:
  # Esquema ejecutable para elegir Apple Watch como destino de Run en Xcode.
  # El target ReperaWatchWidget es solo la complicación, no la app.
  ReperaWatch:
    build:
      targets:
        ReperaWatch: all
    run:
      config: Debug
      executable: ReperaWatch
  Repera:
    # Xcode ejecuta esta acción antes de compilar y preserva las versiones
    # introducidas en el proyecto (Build Settings o General del target Repera).
    preActions:
      - name: Guardar versión de Xcode
        settingsTarget: Repera
        script: |
          python3 "$SRCROOT/scripts/sync_versions.py" --from-env
    build:
      targets:
        Repera: all
        ReperaWatch: all
        ReperaRestWidget: all
    run:
      config: Debug
      executable: Repera
    test:
      targets:
        - ReperaUITests
